<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webix OS WebApp</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="header">
            <h1>Webix OS</h1>
            <div id="clock" class="clock">00:00:00</div>
        </header>

        <!-- Навігація між екранами (Рівень 3) -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('home')"><i class="fas fa-home"></i> Головна</button>
            <button class="tab-btn" onclick="switchTab('weather')"><i class="fas fa-cloud-sun"></i> Погода</button>
            <button class="tab-btn" onclick="switchTab('profile')"><i class="fas fa-user"></i> Профіль</button>
        </nav>

        <!-- Контент екранів -->
        <main class="content">
            <!-- Екран 1: Головна -->
            <section id="screen-home" class="screen active">
                <h2>Головна панель</h2>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="handleMenuClick('Головна')"><i class="fas fa-star"></i> Опція 1</button>
                    <button class="menu-btn" onclick="handleMenuClick('Налаштування')"><i class="fas fa-cog"></i> Налаштування</button>
                    <button class="menu-btn" onclick="handleMenuClick('Про додаток')"><i class="fas fa-info-circle"></i> Про додаток</button>
                </div>
            </section>

            <!-- Екран 2: Погода (Рівень 3) -->
            <section id="screen-weather" class="screen">
                <h2>Погода</h2>
                <div class="weather-card">
                    <i class="fas fa-sun weather-icon"></i>
                    <div class="weather-temp">+18°C</div>
                    <div class="weather-desc">Ясно ☀️</div>
                </div>
            </section>

            <!-- Екран 3: Профіль (Рівень 3) -->
            <section id="screen-profile" class="screen">
                <h2>Профіль користувача</h2>
                <div class="profile-card">
                    <i class="fas fa-user-circle profile-avatar"></i>
                    <p id="user-name">Завантаження...</p>
                </div>
            </section>
        </main>

        <!-- Кастомний Toast-блок (Рівень 1 & 2) -->
        <div id="toast" class="toast hidden">
            <i class="fas fa-bell"></i>
            <span id="toast-message">Оберіть пункт меню...</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
